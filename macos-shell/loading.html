<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RepairSync</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #111827;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ffffff;
    }
    main {
      width: min(480px, calc(100vw - 48px));
      padding: 34px;
      text-align: center;
    }
    img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      border-radius: 16px;
    }
    h1 {
      margin: 18px 0 10px;
      font-size: 27px;
      line-height: 1.15;
      letter-spacing: 0;
    }
    p {
      margin: 0 auto;
      max-width: 380px;
      color: #4b5563;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 600;
    }
    .spinner {
      width: 32px;
      height: 32px;
      margin: 22px auto 0;
      border: 4px solid #e5e7eb;
      border-top-color: #2563eb;
      border-radius: 999px;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <img src="./build/icon.png" alt="">
    <h1>Opening RepairSync</h1>
    <p>Loading your RepairSync workspace.</p>
    <div class="spinner" aria-label="Loading"></div>
  </main>
</body>
</html>
